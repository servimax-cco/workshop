<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ServiMax Workshop">
  <meta name="robots" content="noindex,nofollow">
  <title>ServiMax Workshop</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b0c0d;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    #workshop {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      background: #0b0c0d;
    }

    #fallback {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0b0c0d;
      color: #f4f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    #fallback a {
      display: inline-block;
      margin-top: 14px;
      padding: 14px 22px;
      border-radius: 12px;
      background: #d7aa68;
      color: #111;
      text-decoration: none;
      font-weight: 800;
    }
  </style>
</head>

<body>
  <iframe
    id="workshop"
    src="https://script.google.com/macros/s/AKfycbx4-G_wIPkMLKhq1QRGFr9qM3kGUl8T_mk5NMfILqO_ia2_8KfjswIXq0d_U8Y_dDuB/exec"
    title="ServiMax Workshop"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <div id="fallback">
    <div>
      <strong>ServiMax Workshop</strong>
      <p>No fue posible cargar el sistema dentro de esta página.</p>
      <a href="https://script.google.com/macros/s/AKfycbx4-G_wIPkMLKhq1QRGFr9qM3kGUl8T_mk5NMfILqO_ia2_8KfjswIXq0d_U8Y_dDuB/exec">Abrir Workshop</a>
    </div>
  </div>

  <script>
    const frame = document.getElementById('workshop');
    const fallback = document.getElementById('fallback');

    // Si el iframe no logra cargar, ofrece acceso directo.
    const timeout = setTimeout(() => {
      // No podemos inspeccionar el contenido cross-origin; solo dejamos
      // preparado el fallback para errores explícitos del navegador.
    }, 12000);

    frame.addEventListener('load', () => {
      clearTimeout(timeout);
    });

    frame.addEventListener('error', () => {
      frame.style.display = 'none';
      fallback.style.display = 'flex';
    });
  </script>
</body>
</html>
