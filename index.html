<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111315">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ServiMax Workshop">
  <meta name="robots" content="noindex,nofollow">
  <title>ServiMax Workshop</title>
  <style>
    :root {
      --bg: #111315;
      --panel: #1b1e20;
      --panel-2: #24272A;
      --text: #F4F5F5;
      --muted: #AEB3B7;
      --gold: #c9a55c;
      --gold-2: #e0c47d;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top))
               max(18px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom))
               max(18px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 50% -10%, rgba(201,165,92,.16), transparent 36%),
        linear-gradient(180deg, #151719 0%, var(--bg) 58%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .wrap { width: min(100%, 430px); text-align: center; }
    .brand {
      margin: 0 auto 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 88px;
    }
    .brand img {
      display: block;
      max-width: 250px;
      max-height: 96px;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .card {
      padding: 30px 24px 24px;
      background: linear-gradient(180deg, rgba(36,39,42,.95), rgba(27,30,32,.98));
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 22px;
      box-shadow: 0 24px 70px rgba(0,0,0,.30);
    }
    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: -.5px;
      font-weight: 750;
    }
    .subtitle {
      margin: 8px 0 25px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    .loader {
      width: 38px;
      height: 38px;
      margin: 0 auto 18px;
      border: 3px solid rgba(201,165,92,.20);
      border-top-color: var(--gold-2);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      margin: 0 0 18px;
      font-size: 14px;
      color: #d8dadd;
    }
    .btn {
      appearance: none;
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(180deg, var(--gold-2), var(--gold));
      color: #151515;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .1px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(201,165,92,.18);
    }
    .foot {
      margin-top: 17px;
      color: #777d81;
      font-size: 12px;
    }
    noscript .loader { display: none; }
  </style>
  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbx4-G_wIPkMLKhq1QRGFr9qM3kGUl8T_mk5NMfILqO_ia2_8KfjswIXq0d_U8Y_dDuB/exec";
    function openWorkshop() {
      window.location.replace(APP_URL);
    }
    window.addEventListener("load", () => {
      setTimeout(openWorkshop, 900);
    });
  </script>
</head>
